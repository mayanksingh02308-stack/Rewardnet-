<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>QuickToolBox & Downloader</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Adsgram SDK -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background-color: var(--tg-theme-bg-color, #0b1329);
      color: var(--tg-theme-text-color, #f8fafc);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col justify-between font-sans">

  <!-- Header -->
  <header class="mb-4">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-lg font-bold text-white shadow-lg">
          ⚡
        </div>
        <div>
          <h1 class="font-bold text-base tracking-wide leading-tight">QuickMedia & Tools</h1>
          <p class="text-xs text-slate-400">Reels, Shorts & Image Utility</p>
        </div>
      </div>
      <span class="text-[11px] bg-emerald-950 text-emerald-400 border border-emerald-800 px-2.5 py-0.5 rounded-full font-medium">
        Free Pro
      </span>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <div class="flex bg-slate-800/80 p-1 rounded-xl mb-4 border border-slate-700">
    <button id="tab-video" onclick="switchMode('video')" class="flex-1 py-2 text-xs font-semibold rounded-lg bg-blue-600 text-white transition-all">
      📥 Video Downloader
    </button>
    <button id="tab-img" onclick="switchMode('img')" class="flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition-all">
      🖼️ Image Tools
    </button>
  </div>

  <!-- Main Container -->
  <main class="space-y-4 flex-1">
    
    <!-- SECTION 1: VIDEO DOWNLOADER -->
    <div id="video-section" class="space-y-3">
      <div class="bg-slate-800/60 border border-slate-700 rounded-2xl p-4">
        <label class="block text-xs font-medium text-slate-300 mb-2">Paste Video Link (Shorts, Reels, FB, X)</label>
        <div class="relative">
          <input type="text" id="videoUrl" placeholder="https://www.instagram.com/reel/..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-blue-500" />
          <button onclick="pasteFromClipboard()" class="absolute right-2 top-2 bg-slate-800 hover:bg-slate-700 text-[11px] text-blue-400 px-2.5 py-1.5 rounded-lg border border-slate-700">
            Paste
          </button>
        </div>

        <div class="flex items-center space-x-2 mt-3 text-[11px] text-slate-400">
          <span>Supported:</span>
          <span class="bg-slate-700/50 px-1.5 py-0.5 rounded text-rose-400">Instagram</span>
          <span class="bg-slate-700/50 px-1.5 py-0.5 rounded text-red-500">YouTube</span>
          <span class="bg-slate-700/50 px-1.5 py-0.5 rounded text-blue-400">Facebook</span>
        </div>
      </div>
    </div>

    <!-- SECTION 2: IMAGE TOOLS (Hidden by default) -->
    <div id="img-section" class="hidden space-y-3">
      <div class="grid grid-cols-2 gap-2">
        <button onclick="selectImgTool('compress')" id="tool-compress" class="p-2.5 rounded-xl border border-blue-500 bg-slate-800/80 text-left text-xs font-semibold">
          🗜️ Compress
        </button>
        <button onclick="selectImgTool('webp')" id="tool-webp" class="p-2.5 rounded-xl border border-slate-700 bg-slate-800/40 text-left text-xs font-semibold">
          🔄 To WebP
        </button>
      </div>

      <div class="bg-slate-800/60 border border-slate-700 rounded-2xl p-4">
        <label class="flex flex-col items-center justify-center border-2 border-dashed border-slate-600 rounded-xl p-5 cursor-pointer bg-slate-900/50">
          <span id="img-label" class="text-xs text-slate-300 font-medium">Select Image from Device</span>
          <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleImg(event)" />
        </label>
      </div>
    </div>

    <!-- Status Message Display -->
    <div id="status-box" class="p-3 rounded-xl text-center text-xs font-medium hidden"></div>

  </main>

  <!-- Bottom CTA / Download Button -->
  <footer class="mt-4">
    <button id="mainBtn" onclick="handleStartProcess()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg transition-all flex items-center justify-center space-x-2">
      <span id="btn-text">⚡ Download / Process</span>
    </button>
    <p class="text-[10px] text-center text-slate-500 mt-2">Free utility supported by a short partner ad</p>
  </footer>

  <script>
    // 1. Initialize Telegram Mini App
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // 2. Initialize Adsgram with UnitID 47374
    let AdController = null;
    if (window.Adsgram) {
      AdController = window.Adsgram.init({ 
        blockId: "47374", 
        debug: true // Unit approve hone tak test ad trigger karega, baad me false kar sakte hain
      });
    }

    let activeTab = 'video';
    let currentImgTool = 'compress';
    let loadedImage = null;
    let selectedFile = null;

    function switchMode(mode) {
      activeTab = mode;
      const vSec = document.getElementById('video-section');
      const iSec = document.getElementById('img-section');
      const tVid = document.getElementById('tab-video');
      const tImg = document.getElementById('tab-img');

      if (mode === 'video') {
        vSec.classList.remove('hidden');
        iSec.classList.add('hidden');
        tVid.className = 'flex-1 py-2 text-xs font-semibold rounded-lg bg-blue-600 text-white';
        tImg.className = 'flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400';
      } else {
        vSec.classList.add('hidden');
        iSec.classList.remove('hidden');
        tImg.className = 'flex-1 py-2 text-xs font-semibold rounded-lg bg-blue-600 text-white';
        tVid.className = 'flex-1 py-2 text-xs font-semibold rounded-lg text-slate-400';
      }
    }

    function selectImgTool(tool) {
      currentImgTool = tool;
      document.getElementById('tool-compress').className = tool === 'compress' 
        ? 'p-2.5 rounded-xl border border-blue-500 bg-slate-800/80 text-left text-xs font-semibold'
        : 'p-2.5 rounded-xl border border-slate-700 bg-slate-800/40 text-left text-xs font-semibold';
      document.getElementById('tool-webp').className = tool === 'webp'
        ? 'p-2.5 rounded-xl border border-blue-500 bg-slate-800/80 text-left text-xs font-semibold'
        : 'p-2.5 rounded-xl border border-slate-700 bg-slate-800/40 text-left text-xs font-semibold';
    }

    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById('videoUrl').value = text;
      } catch (err) {
        alert("Clipboard permission denied. Please paste manually.");
      }
    }

    function handleImg(e) {
      const file = e.target.files[0];
      if (!file) return;
      selectedFile = file;
      document.getElementById('img-label').innerText = `Loaded: ${file.name.substring(0, 18)}...`;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => { loadedImage = img; };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Process Trigger + Monetization Gate
    function handleStartProcess() {
      const statusBox = document.getElementById('status-box');
      statusBox.classList.remove('hidden', 'bg-emerald-950', 'text-emerald-400', 'bg-rose-950', 'text-rose-400');
      statusBox.classList.add('bg-slate-800', 'text-amber-400');
      statusBox.innerText = "Loading partner ad...";

      if (AdController) {
        AdController.show().then(() => {
          runSelectedTask();
        }).catch((err) => {
          console.warn("Ad bypassed/failed:", err);
          runSelectedTask();
        });
      } else {
        runSelectedTask();
      }
    }

    function runSelectedTask() {
      if (activeTab === 'video') {
        downloadSocialVideo();
      } else {
        processLocalImage();
      }
    }

    // Video Downloader API Resolver
    async function downloadSocialVideo() {
      const urlInput = document.getElementById('videoUrl').value.trim();
      const statusBox = document.getElementById('status-box');

      if (!urlInput) {
        statusBox.className = 'p-3 rounded-xl text-center text-xs font-medium bg-rose-950 text-rose-400';
        statusBox.innerText = "⚠️ Please paste a valid video URL.";
        return;
      }

      statusBox.innerText = "Connecting to media stream...";

      try {
        // Free open-source Cobalt API instance
        const response = await fetch('https://api.cobalt.tools/api/json', {
          method: 'POST',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            url: urlInput,
            vQuality: '720'
          })
        });

        const data = await response.json();

        if (data.url) {
          statusBox.className = 'p-3 rounded-xl text-center text-xs font-medium bg-emerald-950 text-emerald-400';
          statusBox.innerText = "✅ Video found! Starting download...";
          
          const a = document.createElement('a');
          a.href = data.url;
          a.download = `Media_${Date.now()}.mp4`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        } else {
          throw new Error(data.text || "Could not fetch media link");
        }
      } catch (error) {
        statusBox.className = 'p-3 rounded-xl text-center text-xs font-medium bg-rose-950 text-rose-400';
        statusBox.innerText = "❌ Download failed or URL unsupported. Try another video link.";
      }
    }

    // Client-side Canvas Image Engine
    function processLocalImage() {
      const statusBox = document.getElementById('status-box');
      if (!loadedImage) {
        statusBox.className = 'p-3 rounded-xl text-center text-xs font-medium bg-rose-950 text-rose-400';
        statusBox.innerText = "⚠️ Please choose an image first.";
        return;
      }

      const canvas = document.createElement('canvas');
      canvas.width = loadedImage.width;
      canvas.height = loadedImage.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(loadedImage, 0, 0);

      const mime = currentImgTool === 'webp' ? 'image/webp' : 'image/jpeg';
      const ext = currentImgTool === 'webp' ? 'webp' : 'jpg';
      const dataUrl = canvas.toDataURL(mime, 0.65);

      const dl = document.createElement('a');
      dl.href = dataUrl;
      dl.download = `QuickTool_${Date.now()}.${ext}`;
      document.body.appendChild(dl);
      dl.click();
      document.body.removeChild(dl);

      statusBox.className = 'p-3 rounded-xl text-center text-xs font-medium bg-emerald-950 text-emerald-400';
      statusBox.innerText = "✅ Image processed and downloaded!";
    }
  </script>
</body>
</html>
